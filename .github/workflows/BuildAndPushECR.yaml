name: Java CI and GHCR Push

on:
  push:
    branches: [ "demo-beckn" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_URI: ghcr.io/${{ github.repository }}
  # Incremental release tags: demo-beckn-v1, demo-beckn-v2, ... (one new tag per successful build)
  VERSION_TAG_PREFIX: demo-beckn-v
  # Moving tag for the newest demo-beckn build. Kept apart from :latest, which other branches publish
  LATEST_TAG: demo-beckn-latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine next version tag
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        OWNER="${{ github.repository_owner }}"
        PKG="${{ github.event.repository.name }}"
        PREFIX="${VERSION_TAG_PREFIX}"
        TAGS=$(gh api "/orgs/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
          --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -E "^${PREFIX}[0-9]+$" || true)
        if [ -z "$TAGS" ]; then
          VERSION_TAG="${PREFIX}1"
        else
          MAX_NUM=$(echo "$TAGS" | sed "s/^${PREFIX}//" | sort -n | tail -1)
          VERSION_TAG="${PREFIX}$((MAX_NUM + 1))"
        fi
        echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
        echo "Version tag for this build: ${VERSION_TAG}"

    - name: Build project
      run: ./gradlew build

    # Built from the repository Dockerfile rather than bootBuildImage: the image build no longer
    # depends on Spring Boot's own Docker client, and the image keeps a shell for debugging.
    - name: Build container image
      run: docker build -t ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} .

    - name: Tag image as demo-beckn-latest
      run: docker tag ${IMAGE_URI}:${{ steps.version.outputs.version_tag }} ${IMAGE_URI}:${LATEST_TAG}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push version and demo-beckn-latest to GHCR
      run: |
        VERSION_TAG="${{ steps.version.outputs.version_tag }}"
        docker push ${IMAGE_URI}:${VERSION_TAG}
        docker push ${IMAGE_URI}:${LATEST_TAG}
