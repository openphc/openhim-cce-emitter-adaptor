# Production profile — env-var driven config, structured JSON logging, heartbeat enabled
server:
  port: ${SERVER_PORT:8082}

mediator:
  urn: ${MEDIATOR_URN:urn:mediator:cce-emitter-adaptor}
  version: ${MEDIATOR_VERSION:1.0.0}
  name: ${MEDIATOR_NAME:CCE Emitter Adaptor}
  endpoint:
    host: ${MEDIATOR_ENDPOINT_HOST:emitter-adaptor}
    path: ${MEDIATOR_ENDPOINT_PATH:/inbound}
    type: ${MEDIATOR_ENDPOINT_TYPE:http}

openhim:
  core:
    host: ${OPENHIM_CORE_HOST}
    api-port: ${OPENHIM_CORE_API_PORT:8080}
    scheme: ${OPENHIM_CORE_SCHEME:https}
    auth-type: ${OPENHIM_CORE_AUTH_TYPE:basic}
    username: ${OPENHIM_USERNAME}
    password: ${OPENHIM_PASSWORD}
  heartbeat:
    enabled: true
    interval-seconds: ${OPENHIM_HEARTBEAT_INTERVAL:10}

cce:
  collector:
    url: ${CCE_COLLECTOR_URL}
    events-path: ${CCE_COLLECTOR_EVENTS_PATH:/v1/events}
    timeout: ${CCE_COLLECTOR_TIMEOUT:5000}
    retry:
      max-attempts: ${CCE_COLLECTOR_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${CCE_COLLECTOR_RETRY_BACKOFF_MS:1000}
    auth:
      token: ${CCE_COLLECTOR_AUTH_TOKEN:}
      keycloak-host: ${KEYCLOAK_HOST:}
      realm: ${KEYCLOAK_REALM:cce}
      client-id: ${KEYCLOAK_CLIENT_ID:}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  emitter:
    patient-identifier-system: ${PATIENT_IDENTIFIER_SYSTEM:http://openphc.org/identifier/upid}
    redaction:
      # The `rules` (the "*" entry plus one per resourceType) are defined ONCE, in application.yml, and
      # apply here unchanged - profile files layer over the base, so anything not restated is
      # inherited. They are deliberately not duplicated: two copies would drift, and the PROD copy
      # drifting is precisely the failure that leaks clinical data.
      #
      # To change what is redacted in PROD, edit application.yml. Restating `rules` here REPLACES
      # the base list wholesale (Spring does not merge lists), so only do so to redact MORE.
      #
      # Setting this to false forwards full clinical payloads to the Collector, which persists them
      # to inbound_event_log. Only for a time-boxed debugging window, never routine.
      enabled: ${REDACTION_ENABLED:true}
    facility-filter:
      ids: ${FACILITY_FILTER_IDS:}   # empty = filter inactive; comma-separated to restrict (e.g. "0234,abc-123")
    sources:
      ebuzima:
        client-id: ${EBUZIMA_CLIENT_ID}
      spice:
        client-id: ${SPICE_CLIENT_ID}
      openmrs:
        client-id: ${OPENMRS_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: cce-emitter-adaptor

logging:
  level:
    org.openphc.cce: INFO
    org.springframework.web: WARN
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%level","logger":"%logger","message":"%msg"}%n'
